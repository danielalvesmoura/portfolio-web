<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC_ARCHITECT</title>

    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/skills.css">
    <link rel="stylesheet" href="css/education.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head> 
<body>
    <header id="navbar">
        <h1>KINETIC_ARCHITECT</h1>

        <nav>
            <ul>
                <li><a href="#about" data-i18n="header_about" class="active nav_link"></a></li>
                <li><a href="#projects" data-i18n="header_projects" class="nav_link"></a></li>
                <li><a href="#skills" data-i18n="header_skills" class="nav_link"></a></li>
                <li><a href="#education" data-i18n="header_education" class="nav_link"></a></li>
                <li><a href="#contact" data-i18n="header_contact" class="nav_link"></a></li>
            </ul>
        </nav>

        <button onclick="changeLanguage()">
            <span id="btn_pt" class="active">PT</span>
            <span id="btn_en">EN</span>
            
        </button>
        
        
    </header>

    <main>
        <section id="about">
            <div>
                <header>
                    <p data-i18n="about_subtitle" class="subtitulo"></p>
                    <h1 data-i18n="about_title"></h1>
                </header>

                <p data-i18n="about_description"></p>

                <nav>
                    <a class="active" data-i18n="about_see_projects"></a> 
                    <a data-i18n="about_curriculum"></a>
                </nav>
            </div>
            
            <figure>
                <img src="assets/img/profile_picture.jpg" data-i18n="about_img_alt" alt="">
            </figure>
        </section>

        <section id="projects">
            
            <header>
                <p data-i18n="projects_header_title"></p>
                <h1 data-i18n="projects_header_subtitle"></h1>
            </header>

            <div id="projects-cards">
                <article>
                    <div id="projects-card-description">
                        <header>
                            <p data-i18n="projects_subtitle"></p>
                            <h2 data-i18n="projects_title"></h2>
                        </header>

                        <p data-i18n="projects_description"></p>
                        
                        <nav>
                            <a data-i18n="projects_see_details"></a>
                        </nav>
                    </div>

                    <figure>
                        <img id="img_memory" src="assets/img/memory_game.png" data-i18n="projects_memory_alt" alt="">
                    </figure>
                </article>

                <article>
                    <div>
                        <p data-i18n="projects_subtitle"></p>
                        <h2 data-i18n="projects_title"></h2>
                        <p data-i18n="projects_description"></p>
                    </div>
                </article>

                <article>
                    <div>
                        <p data-i18n="projects_subtitle"></p>
                        <h2 data-i18n="projects_title"></h2>
                        <p data-i18n="projects_description"></p>
                    </div>
                </article>
            </div>

        </section>

        <section id="skills">
            <header>
                <p data-i18n="skills_subtitle"></p>
                <h1 data-i18n="skills_title"></h1>
            </header>

            <ul>
                <li class="skills_card">
                    <img src="assets/img/icon_react.png" data-i18n="skills_react_alt" alt="">
                    <p>REACT</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_python.png" data-i18n="skills_python_alt" alt="">
                    <p>PYTHON</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_database.png" data-i18n="skills_database_alt" alt="">
                    <p>SQL</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_java.png" data-i18n="skills_java_alt" alt="">
                    <p>JAVA</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_html.png" data-i18n="skills_html_alt" alt="">
                    <p>HTML</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_css.png" data-i18n="skills_css_alt" alt="">
                    <p>CSS</p>
                </li>
                <li class="skills_card">
                    <img src="assets/img/icon_js.png" data-i18n="skills_js_alt" alt="">
                    <p>JAVASCRIPT</p>
                </li>
            </ul>
        </section>
            
        <section id="education">
            <header>
                <p data-i18n="education_subtitle" class="subtitle"></p>
                <h1 data-i18n="education_title"></h1>
                <p data-i18n="education_description" class="description"></p>
            </header>

            <div id="education_card">
                <img id="education_ifpr" src="assets/img/ifpr.png" data-i18n="education_ifpr_alt" alt="">
                <span id="education_gradient"></span>

                <div id="education_card_content">
                    <div id="education_top_card">
                        <div id="education_cap_conteiner">
                            <img id="education_studant_cap" src="assets/img/studant_cap.png" data-i18n="education_studant_cap_alt" alt="">
                        </div>
                        <div>
                            <p data-i18n="education_college_title" id="education_college_title">Instituto Federal do Paraná Campus Paranavaí</p>
                            <p data-i18n="education_course_title" id="education_course_title">BACHARELADO EM ENGENHARIA DE SOFTWARE</p>
                        </div>   
                    </div>

                    <ul>
                        <li>
                            <img src="assets/img/icon_calendar.png" alt="" data-i18n="education_calendar_alt">
                            <p data-i18n="education_course_duration">2024 - Presente (Expectitiva 2027)</p>
                        </li>

                        <li>
                            <img src="assets/img/icon_location.png" alt="" data-i18n="education_location_alt">
                            <p data-i18n="education_course_location">Paranavaí, Paraná, Brasil</p>
                        </li>
                    </ul>
                </div>
                
            </div>

        </section>
        <section id="contact"></section>
    </main>

    <nav id="navbar_mobile">
        <ul>
            <li><a href="#about" data-i18n="header_about" class="active nav_link"></a></li>
            <li><a href="#projects" data-i18n="header_projects" class="nav_link"></a></li>
            <li><a href="#skills" data-i18n="header_skills" class="nav_link"></a></li>
            <li><a href="#education" data-i18n="header_education" class="nav_link"></a></li>
            <li><a href="#contact" data-i18n="header_contact" class="nav_link"></a></li>
        </ul>
    </nav>

    <script src="js/language.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
